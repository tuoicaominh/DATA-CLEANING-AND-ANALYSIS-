services:
  db:
    image: postgres:16-alpine
    container_name: data-cleaning-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-DATA_CLEANING}
      POSTGRES_USER: ${POSTGRES_USER:-data_cleaning}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
