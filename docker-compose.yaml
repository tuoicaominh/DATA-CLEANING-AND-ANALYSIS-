services:
  db:
    image: postgres:16-alpine
    container_name: data-cleaning-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-DATA_CLEANING}
      POSTGRES_USER: ${POSTGRES_USER:-data_cleaning}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: data-cleaning-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-data_cleaning}:${POSTGRES_PASSWORD:-123}@db:5432/${POSTGRES_DB:-DATA_CLEANING}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
